<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Framatex · Recherche documentaire</title><link rel="stylesheet" href="/assets/partners.css"><link rel="stylesheet" href="/assets/phase3.css"><script defer src="/assets/document-search.js"></script><link rel="stylesheet" href="/assets/guide.css"><link rel="stylesheet" href="/assets/vendor/driver.css"><script defer src="/assets/vendor/driver.js"></script><script defer src="/assets/guide.js"></script><script defer src="/assets/guide-search.js"></script></head><body><header><a href="/">Espace interne</a><h1>Recherche documentaire</h1><p>Recherche sur les métadonnées des documents autorisés. Les versions courantes sont sélectionnées par défaut.</p></header><main><form id="search-form"><label>Titre ou nom du fichier <input name="q" type="search"></label><label>Commande <input name="order_ref"></label><label>Référence ORLI <input name="orli_ref"></label><label>Client <input name="client"></label><label>Fournisseur d’origine <input name="supplier"></label><label>Type documentaire <input name="doc_type"></label><label>Rubrique <select name="folder"><option value="">Toutes</option><option>jaune</option><option>rose</option><option>bleu</option><option>vert</option></select></label><label>Auteur interne du dépôt <input name="author"></label><label>Dernière décision documentaire <select name="status"><option value="">Toutes</option><option value="approved">Approuvé</option><option value="rejected">Refusé</option><option value="changes_requested">Reprise demandée</option><option value="to_review">À vérifier</option></select></label><label>Depuis <input name="after" type="datetime-local"></label><label>Jusqu’à <input name="before" type="datetime-local"></label><label>Numéro de version (vide = courante) <input name="version" type="number" min="1"></label><label>Tri <select name="sort"><option value="newest">Plus récent</option><option value="oldest">
