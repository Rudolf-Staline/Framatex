<!doctype html>
<html lang="fr"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Framatex · Recherche documentaire</title>
  <meta name="theme-color" content="#f7f6f2">
  <link rel="icon" type="image/svg+xml" href="/assets/dossier-jaune-mark.svg">
  <link rel="stylesheet" href="/assets/atelier-foundation.css">
  <link rel="stylesheet" href="/assets/partners.css?v=atelier2">
  <script defer src="/assets/document-search.js?v=atelier2"></script>
  <link rel="stylesheet" href="/assets/vendor/driver.css">
  <link rel="stylesheet" href="/assets/guide.css?v=atelier2">
  <script defer src="/assets/vendor/driver.js"></script>
  <script defer src="/assets/guide.js"></script>
  <script defer src="/assets/guide-search.js"></script>
</head>
<body class="atelier-public atelier-search-page">
  <header class="atelier-public-header">
    <div class="atelier-public-header-inner">
      <a class="atelier-brand" href="/"><img src="/assets/dossier-jaune-mark.svg" width="36" height="36" alt=""><span>Dossier Jaune<small>par Framatex</small></span></a>
      <nav class="atelier-public-links" aria-label="Retour à Framatex"><a href="/">← Espace interne</a></nav>
    </div>
    <div class="atelier-public-heading">
      <h1>Recherche documentaire</h1>
      <p>Recherchez dans les documents auxquels vous avez accès. Par défaut, seules les versions courantes sont affichées.</p>
    </div>
  </header>
  <main class="atelier-public-main">
    <form id="search-form" class="atelier-search-form">
      <div class="search-filter-grid">
        <label>Titre ou nom du fichier <input name="q" type="search"></label>
        <label>Commande <input name="order_ref"></label>
        <label>Fournisseur d’origine <input name="supplier"></label>
      </div>
      <details>
        <summary>Filtres avancés</summary>
        <div class="search-filter-grid">
          <label>Référence ORLI <input name="orli_ref"></label>
          <label>Client <input name="client"></label>
          <label>Type documentaire <input name="doc_type"></label>
          <label>Rubrique <select name="folder"><option value="">Toutes</option><option value="jaune">Jaune</option><option value="rose">Rose</option><option value="bleu">Bleue</option><option value="vert">Verte</option></select></label>
          <label>Auteur interne du dépôt <input name="author"></label>
          <label>Dernière décision documentaire <select name="status"><option value="">Toutes</option><option value="approved">Approuvé</option><option value="rejected">Refusé</option><option value="changes_requested">Reprise demandée</option><option value="to_review">À vérifier</option></select></label>
          <label>Depuis <input name="after" type="datetime-local"></label>
          <label>Jusqu’à <input name="before" type="datetime-local"></label>
          <label>Numéro de version (vide = courante) <input name="version" type="number" min="1"></label>
        </div>
      </details>
      <div class="search-form-actions">
        <label>Tri <select name="sort"><option value="newest">Plus récent</option><option value="oldest">Plus ancien</option><option value="title">Titre</option></select></label>
        <button type="submit">Rechercher</button>
      </div>
    </form>
    <section class="atelier-search-results" aria-labelledby="search-results-title">
      <h2 id="search-results-title">Résultats</h2>
      <p id="search-status" class="atelier-service-status" role="status"></p>
      <div id="search-results"></div>
      <nav class="partner-actions partner-pages" aria-label="Pagination des résultats">
        <button type="button" id="previous" disabled>Précédent</button><button type="button" id="next" disabled>Suivant</button>
      </nav>
    </section>
  </main>
</body></html>
